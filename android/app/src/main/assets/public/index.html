      (function() {
        if (typeof window === 'undefined') return;
        function isViteWsError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('closed without opened');
        }
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e ? e.reason : null)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isViteWsError(e ? e.message : null) || isViteWsError(e ? e.error : null)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
